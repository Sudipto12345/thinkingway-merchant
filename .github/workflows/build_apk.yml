name: Build QR BANGLA (THINKINGWAY) APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Flutter Android Project & Copy QR BANGLA Source
        run: |
          flutter create --org com.thinkingway --project-name qr_bangla_merchant ./build_workspace
          cp -r lib/* ./build_workspace/lib/
          cp pubspec.yaml ./build_workspace/pubspec.yaml
          cd ./build_workspace
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../QR-BANGLA-THINKINGWAY-v1.0.0-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-BANGLA-THINKINGWAY-APK
          path: QR-BANGLA-THINKINGWAY-v1.0.0-release.apk
          retention-days: 30
